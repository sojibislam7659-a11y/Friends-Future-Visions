<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>লগইন | Friends Future Vision Forever</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="portal.css"><style>body{display:grid;place-items:center;min-height:100vh;padding:15px}.login{width:min(100%,440px);padding:30px;background:#fff;border:1px solid #dce8e0;border-radius:16px}.login .brand{margin-bottom:24px}.login h1{font-size:27px;color:#164e3d}.login form{display:grid;gap:10px}.login label{font-weight:700;font-size:13px}.login input{padding:12px;border:1px solid #d7e3da;border-radius:9px;min-height:48px}.login .message{display:none;padding:10px;background:#fff0ef;border-radius:8px;color:#963b35}.login button{margin-top:12px}</style></head><body><main class="login"><div class="brand"><img src="friends-future-vision-logo.svg" alt="Logo"><div><strong>ফ্রেন্ডস ফিউচার ভিশন ফরএভার</strong><small>Friends Future Vision Forever</small></div></div><h1>সদস্য লগইন</h1><p class="muted">নিবন্ধিত Email ও Password দিয়ে প্রবেশ করুন।</p><form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton">লগইন করুন</button><div class="message" id="message" role="alert"></div></form><p class="muted small">শুধু অনুমোদিত অ্যাকাউন্ট প্রবেশ করতে পারবে।</p><a href="index.html">← মূল পেজ</a></main><script type="module">import {supabase,supabaseReady} from "./supabase-client.js";const form=document.getElementById("loginForm"),btn=document.getElementById("loginButton"),msg=document.getElementById("message");const show=t=>{msg.textContent=t;msg.style.display="block"};if(!supabaseReady)show("Login service configured নয়।");else{const {data}=await supabase.auth.getSession();if(data.session)location.replace("dashboard.html")}form.addEventListener("submit",async e=>{e.preventDefault();if(!supabaseReady)return;btn.disabled=true;btn.textContent="যাচাই হচ্ছে…";msg.style.display="none";const {data,error}=await supabase.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(error){show("লগইন করা যায়নি। তথ্য যাচাই করে আবার চেষ্টা করুন।");}else{const {data:p,error:pe}=await supabase.from("profiles").select("role").eq("id",data.user.id).maybeSingle();if(pe||!p||!["super_admin","admin","member"].includes(p.role)){await supabase.auth.signOut();show("এই অ্যাকাউন্টের কমিটি অনুমতি পাওয়া যায়নি।");}else location.replace("dashboard.html")}btn.disabled=false;btn.textContent="লগইন করুন";document.getElementById("password").value=""});</script></body></html>
