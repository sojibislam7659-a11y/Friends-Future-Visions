<style>

<style id="oikko-design-system">
:root{--green:#075e4b;--green-deep:#064b3d;--green-soft:#eaf3ed;--ink:#142f28;--muted:#687a72;--line:#e1e9e4;--canvas:#f5f8f6;--white:#fff;--radius:18px}
html{scroll-behavior:smooth}
body{font-family:Inter,"Hind Siliguri",system-ui,sans-serif;background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,.brand-name,.brand,.value,.card-label,button,a{font-family:Inter,"Hind Siliguri",system-ui,sans-serif}
:lang(bn),[lang="bn"]{font-family:"Hind Siliguri",Inter,system-ui,sans-serif}
button,a,input{ -webkit-tap-highlight-color:transparent}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #6eb49c;outline-offset:3px}
button{transition:background-color .16s ease,border-color .16s ease,color .16s ease}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
</style><style id="oikko-page-refresh">
body{background:#f5f8f6}
.panel{border-color:#e5ece7;border-radius:20px;box-shadow:0 12px 42px rgba(20,47,40,.045);padding:34px}
.mark{border-radius:14px}

.btn{border-radius:999px;background:var(--green);padding:13px 24px}

<div class="notice">Login ও Member Role যাচাই সফল হলে অনুমোদিত সদস্য-তথ্য এখানে দেখানো হবে। আপাতত কোনো কমিটি ডেটা দেখানো হচ্ছে না।</div>
