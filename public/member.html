<title>সদস্য ড্যাশবোর্ড | ঐক্য সঞ্চয় সমিতি</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4f7f5;color:#18372f;font-family:system-ui,"Noto Sans Bengali",sans-serif}.panel{width:min(100%,480px);padding:28px;background:#fff;border:1px solid #dce7e1;border-radius:16px;text-align:center}.mark{width:48px;height:48px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:#e8f3ed;color:#075e4b;font-size:23px}.muted{color:#687a73;font-size:14px;line-height:1.7}.notice{margin:18px 0;padding:12px;border-radius:10px;background:#fff4d8;color:#72530c;font-size:13px;line-height:1.6}.btn{display:inline-block;padding:11px 20px;border-radius:9px;background:#075e4b;color:white;text-decoration:none;font-weight:700}.back{display:block;margin-top:16px;color:#075e4b;text-decoration:none;font-size:13px}

</style>
<link rel="stylesheet" href="https://fonts.maateen.me/kalpurush/font.css">
</head>
<body><main class="panel" data-protected-panel>
<div class="mark">ঐ</div>
<h2>সদস্য ড্যাশবোর্ড</h2>
<p class="muted">সদস্য ড্যাশবোর্ডে লগইন করা সদস্যের অনুমোদিত তথ্যই দেখানো হবে।</p>
<div class="notice">Login ও Member Role যাচাই সফল হলে অনুমোদিত সদস্য-তথ্য এখানে দেখানো হবে। আপাতত কোনো কমিটি ডেটা দেখানো হচ্ছে না।</div>
<a class="btn" href="login.html">লগইন পেজে যান</a>
<a class="back" href="index.html">মূল পেজে ফিরে যান</a>
</main><script type="module">

await requireRole(["member"]);
