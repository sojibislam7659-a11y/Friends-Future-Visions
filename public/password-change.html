<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<title>পাসওয়ার্ড পরিবর্তন | Friends Future Vision Forever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
<style>
*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:16px;display:grid;place-items:center;overflow-x:hidden;font-family:Inter,"Noto Sans Bengali",sans-serif;background:linear-gradient(135deg,#f2f7fb 0%,#fff 54%,#eff8f0 100%);color:#142b43}
.password-card{width:min(100%,460px);padding:clamp(24px,5vw,38px);background:#fff;border:1px solid #dce6ee;border-radius:22px;box-shadow:0 22px 65px rgba(9,45,80,.12)}
.brand{display:flex;justify-content:center;margin-bottom:22px}
.brand svg{display:block;width:min(300px,100%);height:auto}
h1{margin:0 0 8px;color:#092d50;font-size:clamp(23px,5vw,29px)}
.intro{margin:0 0 18px;color:#52677a;font-size:14px;line-height:1.7}
.account{padding:12px 14px;margin:0 0 16px;border:1px solid #dce6ee;border-radius:11px;background:#f5f8fb}
.account-label{display:block;margin-bottom:4px;color:#657789;font-size:12px}
.account-email{display:block;color:#123e66;font-size:14px;font-weight:700;overflow-wrap:anywhere}
form{display:grid;gap:9px}
label{margin-top:7px;color:#294a65;font-size:13px;font-weight:600}
input{width:100%;min-height:51px;padding:12px 14px;border:1px solid #cfdae4;border-radius:11px;background:#fff;color:#142b43;font:inherit}
input:focus{outline:3px solid rgba(8,127,189,.14);border-color:#0876ad}
button{width:100%;min-height:49px;border:0;border-radius:11px;font:600 14px Inter,"Noto Sans Bengali",sans-serif;cursor:pointer}
.primary{margin-top:12px;background:linear-gradient(105deg,#087fbd,#2fae43);color:#fff}
.skip{margin-top:9px;background:#edf4f8;color:#123e66;border:1px solid #d5e2eb}
button:disabled{opacity:.6;cursor:not-allowed}
.message{display:none;margin-top:13px;padding:12px;border-radius:10px;background:#fff0ef;color:#963b35;border:1px solid #f0d0ce;font-size:13px;line-height:1.6}
.note{margin:15px 0 0;color:#657789;font-size:12px;line-height:1.6;text-align:center}
</style>
</head>
<body>
<main class="password-card">
 <div class="brand" id="passwordPageLogo" aria-label="Friends Future Vision Forever"></div>
 <p id="promptLoading" class="intro">প্রথম লগইন যাচাই হচ্ছে…</p>
 <div id="promptContent" hidden>
 <h1>নতুন Password সেট করতে চান?</h1>
 <p class="intro">আপনার প্রথম লগইনে নিজের পছন্দের Password সেট করতে পারেন। এটি বাধ্যতামূলক নয়—চাইলে Skip করে সরাসরি Dashboard-এ যেতে পারবেন।</p>
 <div class="account">
  <span class="account-label">আপনি এই অ্যাকাউন্টে লগইন করেছেন</span>
  <strong class="account-email" id="accountEmail">ইমেইল যাচাই হচ্ছে…</strong>
 </div>
 <form id="passwordChangeForm">
  <label for="newPassword">নতুন Password (কমপক্ষে ১২ অক্ষর)</label>
  <input id="newPassword" type="password" autocomplete="new-password" minlength="12" required>
  <label for="confirmPassword">নতুন Password আবার লিখুন</label>
  <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
  <button class="primary" id="savePasswordButton" type="submit">Password পরিবর্তন করুন</button>
 </form>
 <button class="skip" id="skipPasswordButton" type="button">এখন নয় — Dashboard-এ যান</button>
 </div>
 <div class="message" id="passwordMessage" role="alert" aria-live="polite"></div>
 <p class="note">এই পেজটি একবারই দেখানো হবে। Skip করলে পরবর্তী লগইনে আর আসবে না।</p>
</main>
<script type="module" src="password-change.js"></script>
</body>
</html>
