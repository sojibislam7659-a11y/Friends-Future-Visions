*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4f7f5;color:#18372f;font-family:Inter,"Hind Siliguri",system-ui,sans-serif}.panel{width:min(100%,480px);padding:28px;background:#fff;border:1px solid #dce7e1;border-radius:16px;text-align:center}.mark{width:48px;height:48px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:#e8f3ed;color:#075e4b;font-size:23px}.muted{color:#687a73;font-size:14px;line-height:1.7}.notice{margin:18px 0;padding:12px;border-radius:10px;background:#fff4d8;color:#72530c;font-size:13px;line-height:1.6}.btn{display:inline-block;padding:11px 20px;border-radius:9px;background:#075e4b;color:white;text-decoration:none;font-weight:700}.back{display:block;margin-top:16px;color:#075e4b;text-decoration:none;font-size:13px}

<style id="oikko-design-system">
:root{--green:#075e4b;--green-deep:#064b3d;--green-soft:#eaf3ed;--ink:#142f28;--muted:#687a72;--line:#e1e9e4;--canvas:#f5f8f6;--white:#fff;--radius:18px}
html{scroll-behavior:smooth}
body{font-family:Inter,"Hind Siliguri",system-ui,sans-serif;background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,.brand-name,.brand,.value,.card-label,button,a{font-family:Inter,"Hind Siliguri",system-ui,sans-serif}
:lang(bn),[lang="bn"]{font-family:"Hind Siliguri",Inter,system-ui,sans-serif}
button,a,input{ -webkit-tap-highlight-color:transparent}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #6eb49c;outline-offset:3px}
button{transition:background-color .16s ease,border-color .16s ease,color .16s ease}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
</style><style id="oikko-page-refresh">
body{padding:24px;background:#f5f8f6}
.panel{width:min(100%,500px);padding:clamp(28px,6vw,42px);border:1px solid #e3ebe5;border-radius:24px;box-shadow:0 18px 50px rgba(20,47,40,.05);text-align:left}
.mark{width:52px;height:52px;margin:0 0 24px;border-radius:16px;background:#eaf3ed;font-size:24px}
h2{margin:0 0 10px;font-size:clamp(25px,4vw,31px);font-weight:750;letter-spacing:-.05em;line-height:1.2}
.muted{margin:0;font-size:14px;line-height:1.85}
.notice{margin:24px 0;padding:16px 18px;border:1px solid #f0e4c7;border-radius:14px;background:#fffaf0;font-size:13px;line-height:1.8}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:12px 23px;border-radius:999px;background:var(--green);font-size:13px;font-weight:700;transition:background .18s ease,transform .18s ease}
.btn:hover{background:var(--green-deep);transform:translateY(-1px)}
.back{margin-top:23px;font-size:13px;font-weight:650}
@media(max-width:520px){body{padding:14px}.panel{padding:27px 22px;border-radius:20px}.mark{margin-bottom:21px}}
</style>
</head>
