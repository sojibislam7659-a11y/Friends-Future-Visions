name: Release static checks

on:
  push:
    branches:
      - release/production-updates-20261117
  pull_request:
    branches:
      - main

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          set -e
          find public -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check whitespace errors
        run: git diff --check
