name: Manual Encrypted Production Backup Restore Test

on:
  push:
    branches: [run/migration-rehearsal-20261123]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/restore-test-production.yml"
      - "backup/google-drive-receiver/Code.gs"
      - "scripts/download_encrypted_backup.py"
      - "scripts/verify_restore_payload.py"
      - "scripts/seed_restore_auth.py"
      - "scripts/test_download_encrypted_backup.py"
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: "Exact run ID from the Drive manifest filename, without _manifest.json"
        required: true
        type: string
      confirm_restore:
        description: "Type RESTORE_TEST to confirm an isolated, temporary restore"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate restore tooling (no secrets, no Drive access)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax and unit tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/download_encrypted_backup.py scripts/verify_restore_payload.py scripts/seed_restore_auth.py
          python -m unittest scripts.test_download_encrypted_backup
      - name: Apps Script syntax
        run: |
          set -euo pipefail
          cp backup/google-drive-receiver/Code.gs /tmp/ffv-drive-receiver.js
          node --check /tmp/ffv-drive-receiver.js
      - name: Workflow YAML syntax
        run: ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/restore-test-production.yml")'

  guard:
    name: Validate explicit restore authorization
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation, backup ID and required Drive secrets
        env:
          CONFIRM_RESTORE: ${{ inputs.confirm_restore || 'RESTORE_TEST' }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id || 'ffv_backup_45070634542_1' }}
          FFV_DRIVE_RECEIVER_URL: ${{ secrets.FFV_DRIVE_RECEIVER_URL }}
          FFV_BACKUP_TOKEN: ${{ secrets.FFV_BACKUP_TOKEN }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM_RESTORE" == "RESTORE_TEST" ]] || { echo "::error::Type RESTORE_TEST exactly."; exit 1; }
          [[ "$BACKUP_RUN_ID" =~ ^[A-Za-z0-9_-]{16,64}$ ]] || { echo "::error::Backup run ID format is invalid."; exit 1; }
          [[ "$FFV_DRIVE_RECEIVER_URL" == https://script.google.com/macros/s/*/exec ]] || { echo "::error::Drive receiver URL is missing or invalid."; exit 1; }
          [[ ${#FFV_BACKUP_TOKEN} -ge 40 ]] || { echo "::error::Drive receiver token is missing or too short."; exit 1; }
          [[ ${#BACKUP_ENCRYPTION_PASSPHRASE} -ge 20 ]] || { echo "::error::Backup encryption passphrase is missing or too short."; exit 1; }
          echo "Restore authorization inputs validated. No Production database credentials are used."

  restore_test:
    name: Download, decrypt, verify and restore in temporary PostgreSQL
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FFV_DRIVE_RECEIVER_URL: ${{ secrets.FFV_DRIVE_RECEIVER_URL }}
      FFV_BACKUP_TOKEN: ${{ secrets.FFV_BACKUP_TOKEN }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      BACKUP_RUN_ID: ${{ inputs.backup_run_id || 'ffv_backup_45070634542_1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout staged Production migrations
        uses: actions/checkout@v4
        with:
          ref: release/ffv-prod-parity-20261122
          path: release-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create private temporary workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ffv-restore-test"
          chmod 700 "$RUNNER_TEMP/ffv-restore-test"
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" > "$RUNNER_TEMP/ffv-restore-test/passphrase"
          chmod 600 "$RUNNER_TEMP/ffv-restore-test/passphrase"

      - name: Download encrypted backup from Google Drive and verify every checksum
        run: |
          set -euo pipefail
          python scripts/download_encrypted_backup.py \
            --run-id "$BACKUP_RUN_ID" \
            --output "$RUNNER_TEMP/ffv-restore-test/production-backup.gpg"

      - name: Decrypt and safely extract archive
        shell: bash
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$RUNNER_TEMP/ffv-restore-test/passphrase" \
            --output "$RUNNER_TEMP/ffv-restore-test/production-backup.tar.gz" \
            --decrypt "$RUNNER_TEMP/ffv-restore-test/production-backup.gpg"
          RESTORE_TMP="$RUNNER_TEMP/ffv-restore-test" python - <<'PY'
          import os
          import tarfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ["RESTORE_TMP"])
          archive = root / "production-backup.tar.gz"
          target = root / "project"
          target.mkdir(mode=0o700)
          with tarfile.open(archive, "r:gz") as bundle:
              for item in bundle.getmembers():
                  path = PurePosixPath(item.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("Unsafe archive path rejected.")
              bundle.extractall(target, filter="data")
          PY

      - name: Verify Auth metadata, Storage bytes, database dump and Edge Function snapshots
        run: python scripts/verify_restore_payload.py "$RUNNER_TEMP/ffv-restore-test/project"

      - name: Start isolated temporary PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          PG_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PG_PASSWORD"
          echo "FFV_RESTORE_PG_PASSWORD=$PG_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name ffv-restore-postgres \
            -e POSTGRES_PASSWORD="$PG_PASSWORD" \
            -e POSTGRES_DB=ffv_restore_test \
            -p 127.0.0.1:55432:5432 \
            -v "$RUNNER_TEMP/ffv-restore-test/project:/restore:ro" \
            postgres:17
          for attempt in $(seq 1 40); do
            if docker exec ffv-restore-postgres pg_isready -U postgres -d ffv_restore_test >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec ffv-restore-postgres pg_isready -U postgres -d ffv_restore_test

      - name: Create minimal Supabase Auth and Storage compatibility schemas
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i -e PGPASSWORD="$FFV_RESTORE_PG_PASSWORD" ffv-restore-postgres \
            psql -h 127.0.0.1 -U postgres -d ffv_restore_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            instance_id uuid,
            id uuid PRIMARY KEY,
            aud varchar(255),
            role varchar(255),
            email varchar(255),
            encrypted_password varchar(255),
            email_confirmed_at timestamptz,
            invited_at timestamptz,
            confirmation_token varchar(255),
            confirmation_sent_at timestamptz,
            recovery_token varchar(255),
            recovery_sent_at timestamptz,
            email_change_token_new varchar(255),
            email_change varchar(255),
            email_change_sent_at timestamptz,
            last_sign_in_at timestamptz,
            raw_app_meta_data jsonb,
            raw_user_meta_data jsonb,
            is_super_admin boolean,
            created_at timestamptz,
            updated_at timestamptz,
            phone varchar(32),
            phone_confirmed_at timestamptz,
            phone_change varchar(32),
            phone_change_token varchar(255),
            phone_change_sent_at timestamptz,
            confirmed_at timestamptz,
            email_change_token_current varchar(255),
            email_change_confirm_status smallint,
            banned_until timestamptz,
            reauthentication_token varchar(255),
            reauthentication_sent_at timestamptz,
            is_sso_user boolean,
            deleted_at timestamptz,
            is_anonymous boolean
          );
          CREATE TABLE auth.mfa_factors (
            id uuid PRIMARY KEY,
            user_id uuid NOT NULL REFERENCES auth.users(id),
            factor_type text NOT NULL,
            status text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE AS $$ SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          CREATE FUNCTION auth.jwt() RETURNS jsonb
            LANGUAGE sql STABLE AS $$ SELECT coalesce(nullif(current_setting('request.jwt.claims', true), '')::jsonb, '{}'::jsonb) $$;
          CREATE FUNCTION auth.role() RETURNS text
            LANGUAGE sql STABLE AS $$ SELECT nullif(current_setting('request.jwt.claim.role', true), '') $$;
          CREATE FUNCTION auth.email() RETURNS text
            LANGUAGE sql STABLE AS $$ SELECT nullif(current_setting('request.jwt.claim.email', true), '') $$;
          CREATE SCHEMA storage;
          CREATE TABLE storage.buckets (
            id text PRIMARY KEY, name text, owner_id uuid, public boolean,
            file_size_limit bigint, allowed_mime_types text[], created_at timestamptz, updated_at timestamptz
          );
          CREATE TABLE storage.objects (
            id uuid PRIMARY KEY, bucket_id text, name text, owner_id uuid,
            metadata jsonb, created_at timestamptz, updated_at timestamptz, last_accessed_at timestamptz
          );
          ALTER TABLE storage.buckets ENABLE ROW LEVEL SECURITY;
          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;
          CREATE FUNCTION storage.foldername(text) RETURNS text[]
            LANGUAGE sql IMMUTABLE AS $folder$ SELECT string_to_array(trim(both '/' from $1), '/') $folder$;
          CREATE FUNCTION storage.filename(text) RETURNS text
            LANGUAGE sql IMMUTABLE AS $$ SELECT regexp_replace($1, '^.*/', '') $$;
          CREATE FUNCTION storage.extension(text) RETURNS text
            LANGUAGE sql IMMUTABLE AS $$ SELECT lower(regexp_replace($1, '^.*\\.', '')) $$;
          SQL

      - name: Seed Auth user IDs and metadata needed by foreign keys
        run: |
          set -euo pipefail
          python scripts/seed_restore_auth.py \
            "$RUNNER_TEMP/ffv-restore-test/project/auth-users.json" \
            "$RUNNER_TEMP/ffv-restore-test/auth-seed.sql"
          docker cp "$RUNNER_TEMP/ffv-restore-test/auth-seed.sql" ffv-restore-postgres:/tmp/auth-seed.sql
          docker exec -e PGPASSWORD="$FFV_RESTORE_PG_PASSWORD" ffv-restore-postgres \
            psql -h 127.0.0.1 -U postgres -d ffv_restore_test -v ON_ERROR_STOP=1 -f /tmp/auth-seed.sql

      - name: Restore Production application schemas and data into temporary PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD="$FFV_RESTORE_PG_PASSWORD" ffv-restore-postgres \
            pg_restore --exit-on-error --single-transaction --clean --if-exists \
              --no-owner --no-privileges \
              --dbname=postgresql://postgres:"$FFV_RESTORE_PG_PASSWORD"@127.0.0.1:5432/ffv_restore_test \
              /restore/production-public-private.dump

      - name: Verify restored schema, RLS, constraints, indexes, triggers and every foreign key
        shell: bash
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD="$FFV_RESTORE_PG_PASSWORD" ffv-restore-postgres \
            psql -h 127.0.0.1 -U postgres -d ffv_restore_test -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            orphan_count bigint;
            rls_missing text;
            unvalidated_count bigint;
            invalid_index_count bigint;
            fk record;
            join_predicate text;
            nonnull_predicate text;
            query_text text;
          BEGIN
            IF to_regclass('public.members') IS NULL THEN
              RAISE EXCEPTION 'Restored public.members table is missing';
            END IF;
            IF to_regnamespace('private') IS NULL THEN
              RAISE EXCEPTION 'Restored private schema is missing';
            END IF;

            SELECT string_agg(format('%I.%I', n.nspname, c.relname), ', ' ORDER BY n.nspname, c.relname)
              INTO rls_missing
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public'
              AND c.relkind IN ('r','p')
              AND NOT c.relrowsecurity;
            IF rls_missing IS NOT NULL THEN
              RAISE EXCEPTION 'RLS is disabled on restored public tables: %', rls_missing;
            END IF;

            SELECT count(*) INTO unvalidated_count
            FROM pg_constraint
            WHERE connamespace IN (
              SELECT oid FROM pg_namespace WHERE nspname IN ('public','private')
            ) AND NOT convalidated;
            IF unvalidated_count > 0 THEN
              RAISE EXCEPTION 'Restored application schemas contain % unvalidated constraints', unvalidated_count;
            END IF;

            SELECT count(*) INTO invalid_index_count
            FROM pg_index i
            JOIN pg_class t ON t.oid=i.indrelid
            JOIN pg_namespace n ON n.oid=t.relnamespace
            WHERE n.nspname IN ('public','private') AND NOT i.indisvalid;
            IF invalid_index_count > 0 THEN
              RAISE EXCEPTION 'Restored application schemas contain % invalid indexes', invalid_index_count;
            END IF;

            -- Validate all restored FK relationships, including references to
            -- the separately seeded temporary auth.users table.
            FOR fk IN
              SELECT con.oid, con.conrelid, con.confrelid, con.conkey, con.confkey,
                     con.conname, con.connamespace
              FROM pg_constraint con
              JOIN pg_namespace ns ON ns.oid=con.connamespace
              WHERE con.contype='f' AND ns.nspname IN ('public','private')
            LOOP
              SELECT string_agg(format('child.%I = parent.%I', ca.attname, pa.attname), ' AND ' ORDER BY keys.ord),
                     string_agg(format('child.%I IS NOT NULL', ca.attname), ' AND ' ORDER BY keys.ord)
                INTO join_predicate, nonnull_predicate
              FROM unnest(fk.conkey, fk.confkey) WITH ORDINALITY AS keys(child_attnum,parent_attnum,ord)
              JOIN pg_attribute ca ON ca.attrelid=fk.conrelid AND ca.attnum=keys.child_attnum
              JOIN pg_attribute pa ON pa.attrelid=fk.confrelid AND pa.attnum=keys.parent_attnum;

              query_text := format(
                'SELECT count(*) FROM %s child WHERE %s AND NOT EXISTS (SELECT 1 FROM %s parent WHERE %s)',
                fk.conrelid::regclass, nonnull_predicate, fk.confrelid::regclass, join_predicate
              );
              EXECUTE query_text INTO orphan_count;
              IF orphan_count > 0 THEN
                RAISE EXCEPTION 'Foreign key % has % orphan rows', fk.conname, orphan_count;
              END IF;
            END LOOP;

            IF EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='members' AND column_name='auth_user_id'
            ) THEN
              EXECUTE 'SELECT count(*) FROM public.members m WHERE m.auth_user_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM auth.users u WHERE u.id=m.auth_user_id)'
                INTO orphan_count;
              IF orphan_count <> 0 THEN
                RAISE EXCEPTION 'Restored members contain % orphan Auth references', orphan_count;
              END IF;
            END IF;
          END $$;

          SELECT 'public_tables' AS check_name, count(*) AS verified
            FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';
          SELECT 'private_tables' AS check_name, count(*) AS verified
            FROM information_schema.tables WHERE table_schema='private' AND table_type='BASE TABLE';
          SELECT 'rls_enabled_public_tables' AS check_name, count(*) AS verified
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public' AND c.relkind IN ('r','p') AND c.relrowsecurity;
          SELECT 'rls_forced_public_tables' AS check_name, count(*) AS verified
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public' AND c.relkind IN ('r','p') AND c.relforcerowsecurity;
          SELECT 'restored_policies' AS check_name, count(*) AS verified
            FROM pg_policies WHERE schemaname IN ('public','private');
          SELECT 'restored_triggers' AS check_name, count(*) AS verified
            FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname IN ('public','private') AND NOT t.tgisinternal;
          SELECT 'restored_constraints' AS check_name, count(*) AS verified
            FROM pg_constraint con JOIN pg_namespace n ON n.oid=con.connamespace
            WHERE n.nspname IN ('public','private');
          SELECT 'restored_indexes' AS check_name, count(*) AS verified
            FROM pg_index i JOIN pg_class t ON t.oid=i.indrelid
            JOIN pg_namespace n ON n.oid=t.relnamespace
            WHERE n.nspname IN ('public','private') AND i.indisvalid;
          SELECT 'restored_members' AS check_name, count(*) AS verified FROM public.members;
          SELECT 'restored_auth_users' AS check_name, count(*) AS verified FROM auth.users;
          SQL

      - name: Seed temporary-only Storage metadata, synthetic MFA fixture and legacy default ACLs
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i -e PGPASSWORD="$FFV_RESTORE_PG_PASSWORD" ffv-restore-postgres \
            psql -h 127.0.0.1 -U postgres -d ffv_restore_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO storage.buckets (id,name,public,file_size_limit,allowed_mime_types) VALUES
            ('committee-documents','committee-documents',false,10485760,ARRAY['image/jpeg','image/png','image/webp','application/pdf']),
            ('committee-proofs','committee-proofs',false,10485760,ARRAY['image/jpeg','image/png','image/webp','application/pdf']),
            ('member-private-documents','member-private-documents',false,10485760,ARRAY['image/jpeg','image/png','image/webp','application/pdf']),
            ('member-profile-photos','member-profile-photos',false,5242880,ARRAY['image/jpeg','image/png','image/webp']),
            ('payment-qr','payment-qr',false,2097152,ARRAY['image/jpeg','image/png','image/webp']);
          INSERT INTO auth.mfa_factors (id,user_id,factor_type,status)
          SELECT gen_random_uuid(),p.id,'totp','verified'
          FROM public.profiles p WHERE p.role='super_admin';
          -- pg_dump --no-privileges intentionally omits ACLs; restore Supabase's
          -- standard schema USAGE baseline for this temporary compatibility DB.
          GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;
          GRANT USAGE ON SCHEMA storage TO anon, authenticated, service_role;
          GRANT USAGE ON SCHEMA private TO authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT ALL ON TABLES TO anon;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT ALL ON SEQUENCES TO anon;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO anon;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT REFERENCES,TRIGGER,TRUNCATE ON TABLES TO authenticated;
          SQL
          factor_count=$(docker exec -e PGPASSWORD="$FFV_RESTORE_PG_PASSWORD" ffv-restore-postgres \
            psql -h 127.0.0.1 -U postgres -d ffv_restore_test -Atc "SELECT count(*) FROM auth.mfa_factors WHERE status='verified'")
          super_count=$(docker exec -e PGPASSWORD="$FFV_RESTORE_PG_PASSWORD" ffv-restore-postgres \
            psql -h 127.0.0.1 -U postgres -d ffv_restore_test -Atc "SELECT count(*) FROM public.profiles WHERE role='super_admin'")
          [[ "$factor_count" == "$super_count" && "$super_count" -gt 0 ]] || { echo "::error::Temporary MFA fixture does not cover each Super Admin."; exit 1; }
          echo "Temporary-only verified MFA fixtures: $factor_count (not Production factors)."

      - name: Rehearse all staged Production migrations on the isolated restored database
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            20261122103000_harden_production_security_definer_wrappers.sql
            20261122113000_add_production_portal_audit_and_password_parity.sql
            20261122114500_align_public_policy_parity.sql
            20261122115000_align_storage_policy_parity.sql
            20261122123000_add_production_immutable_financial_ledger.sql
            20261122124500_revoke_legacy_anon_table_grants.sql
            20261122125000_align_public_table_grants.sql
            20261122125500_align_public_default_privileges.sql
            20261123100000_public_aggregate_data.sql
          )
          for migration in "${migrations[@]}"; do
            source="$GITHUB_WORKSPACE/release-source/supabase/migrations/$migration"
            test -s "$source" || { echo "::error::Missing migration: $migration"; exit 1; }
            docker cp "$source" "ffv-restore-postgres:/tmp/$migration"
            echo "Applying isolated rehearsal migration: $migration"
            docker exec -e PGPASSWORD="$FFV_RESTORE_PG_PASSWORD" ffv-restore-postgres \
              psql -h 127.0.0.1 -U postgres -d ffv_restore_test -X -v ON_ERROR_STOP=1 -f "/tmp/$migration"
          done

      - name: Verify migrated schema, least-privilege grants, RLS and public aggregate boundary
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i -e PGPASSWORD="$FFV_RESTORE_PG_PASSWORD" ffv-restore-postgres \
            psql -h 127.0.0.1 -U postgres -d ffv_restore_test -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            v_member uuid;
            v_super uuid;
            v_profiles bigint;
            v_members bigint;
            v_summary jsonb;
          BEGIN
            IF to_regclass('public.financial_postings') IS NULL
              OR to_regclass('public.site_settings') IS NULL
              OR to_regclass('public.admin_change_audit') IS NULL
              OR to_regclass('private.password_rotation_guards') IS NULL THEN
              RAISE EXCEPTION 'One or more required Production parity objects are missing after migration rehearsal';
            END IF;
            IF NOT has_table_privilege('anon','public.committee_rules','SELECT')
              OR has_table_privilege('anon','public.members','SELECT')
              OR has_table_privilege('anon','public.financial_transactions','SELECT') THEN
              RAISE EXCEPTION 'Anonymous table grants do not match the intended least-privilege boundary';
            END IF;
            IF has_table_privilege('authenticated','public.member_contribution_rates','INSERT')
              OR has_table_privilege('authenticated','public.member_contribution_rates','UPDATE')
              OR has_table_privilege('authenticated','public.member_contribution_rates','DELETE')
              OR has_table_privilege('authenticated','public.financial_transactions','TRUNCATE') THEN
              RAISE EXCEPTION 'Authenticated role retains a forbidden direct table privilege';
            END IF;
            IF NOT has_function_privilege('anon','public.get_public_financial_summary()','EXECUTE')
              OR has_function_privilege('anon','private.get_public_financial_summary_unchecked()','EXECUTE') THEN
              RAISE EXCEPTION 'Public aggregate RPC/helper grants are incorrect';
            END IF;
            IF (SELECT count(*) FROM storage.buckets WHERE NOT public) <> 5 THEN
              RAISE EXCEPTION 'Expected five private Storage buckets after rehearsal';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='storage' AND tablename='objects' AND policyname='Private member docs: Super Admin insert') THEN
              RAISE EXCEPTION 'Expected private-document Storage policy is missing';
            END IF;
            IF EXISTS (
              SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
              WHERE n.nspname='public' AND c.relkind IN ('r','p') AND NOT c.relrowsecurity
            ) THEN
              RAISE EXCEPTION 'A public application table has RLS disabled after migration';
            END IF;
            IF EXISTS (SELECT 1 FROM pg_constraint WHERE connamespace IN ('public'::regnamespace,'private'::regnamespace) AND NOT convalidated)
              OR EXISTS (SELECT 1 FROM pg_index i JOIN pg_class c ON c.oid=i.indrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname IN ('public','private') AND NOT i.indisvalid) THEN
              RAISE EXCEPTION 'Unvalidated constraint or invalid index after migration';
            END IF;
            v_summary := public.get_public_financial_summary();
            IF v_summary ? 'members' OR v_summary ? 'member_id' OR v_summary ? 'personal_due' THEN
              RAISE EXCEPTION 'Public aggregate RPC returned a member-level field';
            END IF;
            SELECT id INTO v_member FROM public.profiles WHERE role='member' ORDER BY id LIMIT 1;
            SELECT id INTO v_super FROM public.profiles WHERE role='super_admin' ORDER BY id LIMIT 1;
            IF v_member IS NULL OR v_super IS NULL THEN
              RAISE EXCEPTION 'Expected member and Super Admin test identities are missing';
            END IF;
            PERFORM set_config('request.jwt.claims',jsonb_build_object('sub',v_member::text,'aal','aal1')::text,true);
            PERFORM set_config('request.jwt.claim.sub',v_member::text,true);
            IF NOT private.has_portal_access() THEN
              RAISE EXCEPTION 'Member portal helper rejected a valid member';
            END IF;
            PERFORM set_config('request.jwt.claims',jsonb_build_object('sub',v_super::text,'aal','aal2')::text,true);
            PERFORM set_config('request.jwt.claim.sub',v_super::text,true);
            IF NOT private.has_portal_access() OR NOT private.is_super_admin() THEN
              RAISE EXCEPTION 'Super Admin helper rejected the Super Admin';
            END IF;
          END $verify$;
          SELECT 'migration_rehearsal' AS check_name, 'PASS' AS result;
          SELECT 'verified_mfa_fixtures_temporary_only' AS check_name, count(*) AS result FROM auth.mfa_factors WHERE status='verified';
          SELECT 'financial_postings' AS check_name, count(*) AS result FROM public.financial_postings;
          SELECT 'public_rls_tables' AS check_name, count(*) AS result FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p') AND c.relrowsecurity;
          SQL
          member_id=$(docker exec -e PGPASSWORD="$FFV_RESTORE_PG_PASSWORD" ffv-restore-postgres psql -h 127.0.0.1 -U postgres -d ffv_restore_test -Atc "SELECT id FROM public.profiles WHERE role='member' ORDER BY id LIMIT 1")
          super_id=$(docker exec -e PGPASSWORD="$FFV_RESTORE_PG_PASSWORD" ffv-restore-postgres psql -h 127.0.0.1 -U postgres -d ffv_restore_test -Atc "SELECT id FROM public.profiles WHERE role='super_admin' ORDER BY id LIMIT 1")
          member_counts=$(docker exec -e PGPASSWORD="$FFV_RESTORE_PG_PASSWORD" ffv-restore-postgres psql -h 127.0.0.1 -U postgres -d ffv_restore_test -At -F ',' -c "BEGIN; SET LOCAL ROLE authenticated; SELECT set_config('request.jwt.claims',json_build_object('sub','$member_id','aal','aal1')::text,true); SELECT set_config('request.jwt.claim.sub','$member_id',true); SELECT (SELECT count(*) FROM public.profiles),(SELECT count(*) FROM public.members); ROLLBACK;" | tail -n 1)
          super_counts=$(docker exec -e PGPASSWORD="$FFV_RESTORE_PG_PASSWORD" ffv-restore-postgres psql -h 127.0.0.1 -U postgres -d ffv_restore_test -At -F ',' -c "BEGIN; SET LOCAL ROLE authenticated; SELECT set_config('request.jwt.claims',json_build_object('sub','$super_id','aal','aal2')::text,true); SELECT set_config('request.jwt.claim.sub','$super_id',true); SELECT (SELECT count(*) FROM public.profiles),(SELECT count(*) FROM public.members); ROLLBACK;" | tail -n 1)
          [[ "$member_counts" == "1,1" ]] || { echo "::error::Member RLS isolation failed: $member_counts"; exit 1; }
          [[ "$super_counts" == "8,7" ]] || { echo "::error::Super Admin RLS visibility failed: $super_counts"; exit 1; }
          echo "Post-migration RLS counts: Member=$member_counts; Super Admin=$super_counts."

      - name: Remove all temporary plaintext, encrypted files and database container
        if: always()
        shell: bash
        run: |
          docker rm -f ffv-restore-postgres >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/ffv-restore-test"
